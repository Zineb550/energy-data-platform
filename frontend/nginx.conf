server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;   # CSV uploads up to 10 MB

  # REST API and Swagger docs -> the "api" container
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # React Router: every other path serves the single-page app
  location / {
    try_files $uri /index.html;
  }
}
