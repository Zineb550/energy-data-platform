<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>

  <!-- Users -->
  <g font-size="13" fill="#0f172a">
    <rect x="30" y="40" width="150" height="56" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="105" y="64" text-anchor="middle" font-weight="600">Visiteur</text>
    <text x="105" y="82" text-anchor="middle" font-size="11" fill="#475569">dashboards publics</text>
    <rect x="30" y="112" width="150" height="56" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="105" y="136" text-anchor="middle" font-weight="600">Utilisateur</text>
    <text x="105" y="154" text-anchor="middle" font-size="11" fill="#475569">data analyst</text>
    <rect x="30" y="184" width="150" height="56" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="105" y="208" text-anchor="middle" font-weight="600">Administrateur</text>
    <text x="105" y="226" text-anchor="middle" font-size="11" fill="#475569">supervision</text>
  </g>

  <!-- Frontend -->
  <rect x="230" y="20" width="250" height="500" rx="14" fill="#f0fdfa" stroke="#14b8a6"/>
  <text x="355" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#115e59">Front-end · React</text>
  <text x="355" y="68" text-anchor="middle" font-size="10" fill="#0f766e">Vite · React Router · Hooks · Tailwind · Recharts</text>
  <g font-size="12" fill="#0f172a">
    <rect x="250" y="88" width="210" height="64" rx="8" fill="#fff" stroke="#99f6e4"/>
    <text x="355" y="110" text-anchor="middle" font-weight="600">pages/</text>
    <text x="355" y="128" text-anchor="middle" font-size="11" fill="#475569">public · app · admin</text>
    <text x="355" y="143" text-anchor="middle" font-size="11" fill="#475569">ProtectedRoute (rôles)</text>
    <rect x="250" y="164" width="210" height="64" rx="8" fill="#fff" stroke="#99f6e4"/>
    <text x="355" y="186" text-anchor="middle" font-weight="600">components/</text>
    <text x="355" y="204" text-anchor="middle" font-size="11" fill="#475569">ChartView · DashboardBoard</text>
    <text x="355" y="219" text-anchor="middle" font-size="11" fill="#475569">FilterBar · UI</text>
    <rect x="250" y="240" width="210" height="64" rx="8" fill="#fff" stroke="#99f6e4"/>
    <text x="355" y="262" text-anchor="middle" font-weight="600">context/ · hooks/</text>
    <text x="355" y="280" text-anchor="middle" font-size="11" fill="#475569">AuthContext (utilisateur)</text>
    <text x="355" y="295" text-anchor="middle" font-size="11" fill="#475569">useApi · useDebounce</text>
    <rect x="250" y="316" width="210" height="64" rx="8" fill="#fff" stroke="#99f6e4"/>
    <text x="355" y="338" text-anchor="middle" font-weight="600">api/client.js</text>
    <text x="355" y="356" text-anchor="middle" font-size="11" fill="#475569">fetch + JWT dans l'en-tête</text>
    <text x="355" y="371" text-anchor="middle" font-size="11" fill="#475569">erreurs uniformes</text>
    <text x="355" y="420" text-anchor="middle" font-size="11" fill="#475569">Port 5173</text>
    <text x="355" y="438" text-anchor="middle" font-size="11" fill="#475569">Affiche, ne décide jamais</text>
    <text x="355" y="456" text-anchor="middle" font-size="11" fill="#475569">des droits d'accès</text>
  </g>

  <!-- Arrow front -> back -->
  <line x1="482" y1="348" x2="548" y2="348" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="548" y1="372" x2="482" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="336" text-anchor="middle" font-size="11" fill="#334155">REST</text>
  <text x="515" y="392" text-anchor="middle" font-size="11" fill="#334155">JSON</text>

  <!-- Arrows users -> front -->
  <line x1="182" y1="68" x2="228" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="182" y1="140" x2="228" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="182" y1="212" x2="228" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Backend -->
  <rect x="550" y="20" width="230" height="500" rx="14" fill="#eff6ff" stroke="#2a78d6"/>
  <text x="665" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Back-end · Node.js</text>
  <text x="665" y="68" text-anchor="middle" font-size="11" fill="#1d4ed8">Express · API REST · port 4000</text>
  <g font-size="12" fill="#0f172a">
    <rect x="568" y="88" width="194" height="70" rx="8" fill="#fff" stroke="#bfdbfe"/>
    <text x="665" y="110" text-anchor="middle" font-weight="600">middlewares/</text>
    <text x="665" y="128" text-anchor="middle" font-size="11" fill="#475569">helmet · cors · rate limit</text>
    <text x="665" y="144" text-anchor="middle" font-size="11" fill="#475569">JWT · rôles · zod · erreurs</text>
    <rect x="568" y="170" width="194" height="50" rx="8" fill="#fff" stroke="#bfdbfe"/>
    <text x="665" y="192" text-anchor="middle" font-weight="600">routes/ → controllers/</text>
    <text x="665" y="209" text-anchor="middle" font-size="11" fill="#475569">36 endpoints, /api/docs</text>
    <rect x="568" y="232" width="194" height="200" rx="8" fill="#fff" stroke="#bfdbfe"/>
    <text x="665" y="254" text-anchor="middle" font-weight="600">services/ (logique métier)</text>
    <g font-size="11" fill="#334155">
      <text x="582" y="278">auth · dataset · csv</text>
      <text x="582" y="298">stats · queryBuilder</text>
      <text x="582" y="318">analysis.engine (SQL)</text>
      <text x="582" y="338">dashboard · admin · activity</text>
      <text x="582" y="364" font-weight="600" fill="#0f172a">Fonctionnalités avancées</text>
      <text x="582" y="384">quality (score /100)</text>
      <text x="582" y="404">outlier (IQR)</text>
      <text x="582" y="424">forecast (tendance linéaire)</text>
    </g>
    <text x="665" y="466" text-anchor="middle" font-size="11" fill="#475569">Valide, contrôle les droits,</text>
    <text x="665" y="484" text-anchor="middle" font-size="11" fill="#475569">calcule</text>
  </g>

  <!-- Arrow back -> db -->
  <line x1="782" y1="348" x2="828" y2="348" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="805" y="336" text-anchor="middle" font-size="11" fill="#334155">SQL</text>
  <text x="805" y="366" text-anchor="middle" font-size="10" fill="#334155">($1, $2…)</text>

  <!-- Database -->
  <g>
    <path d="M830 120 a55 16 0 0 0 110 0 v300 a55 16 0 0 1 -110 0z" fill="#fff7ed" stroke="#eb6834"/>
    <ellipse cx="885" cy="120" rx="55" ry="16" fill="#ffedd5" stroke="#eb6834"/>
    <text x="885" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">PostgreSQL</text>
    <g font-size="11" fill="#334155" text-anchor="middle">
      <text x="885" y="194">users</text>
      <text x="885" y="216">datasets</text>
      <text x="885" y="238">dataset_rows</text>
      <text x="885" y="252" font-size="10" fill="#9a3412">(JSONB)</text>
      <text x="885" y="276">analyses</text>
      <text x="885" y="298">dashboards</text>
      <text x="885" y="320">activity_log</text>
    </g>
  </g>
</svg>
